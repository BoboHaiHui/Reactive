<div class="images-wrapper">
  <img
    src="../../assets/social-auth/google-icon.png"
    aria-hidden="true"
    id="google-login"
    aria-label="google-login"
    (click)="socialAuth('google')"
  />

  <img
    src="../../assets/social-auth/facebook-icon.png"
    aria-hidden="true"
    alt="Login with Facebook"
    id="facebook-login"
    aria-label="facebook-login"
    (click)="socialAuth('facebook')"
  />
</div>
