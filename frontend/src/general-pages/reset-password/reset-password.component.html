<div class="reset-password-container">
  <form [formGroup]="reactiveForm" (ngSubmit)="onSubmit()" class="form-container">
    <mat-form-field appearance="fill">
      <mat-label>Password</mat-label>
      <input matInput [type]="hidePassword ? 'password' : 'text'" placeholder="******" formControlName="password" />
      <button mat-icon-button matSuffix (click)="togglePasswordVisibility()" type="button">
        <mat-icon>{{ hidePassword ? 'visibility_off' : 'visibility' }}</mat-icon>
      </button>
      <mat-error *ngIf="reactiveForm.get('password').hasError('required')"> Field is required </mat-error>
      <mat-error *ngIf="reactiveForm.controls['password'].dirty && reactiveForm.controls['password'].invalid">
        The password format seems to be wrong
      </mat-error>
    </mat-form-field>
    <mat-form-field appearance="fill">
      <mat-label>Retype password</mat-label>
      <input matInput type="password" placeholder="******" formControlName="retypePassword" />
      <mat-error *ngIf="reactiveForm.get('retypePassword').hasError('required')"> Field is required </mat-error>
      <mat-error *ngIf="reactiveForm.getError('passwordMismatch') && reactiveForm.get('retypePassword')?.touched">
        Passwords do not match
      </mat-error>
    </mat-form-field>
    <div>
      <button mat-raised-button color="primary" type="submit" [disabled]="reactiveForm.invalid">Send</button>
    </div>
  </form>
</div>
